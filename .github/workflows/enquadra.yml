name: Enquadra (APK)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Criar o projeto
        id: criar
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/passos.log") 2>&1
          echo "== Criar projeto =="
          mkdir -p enquadra/app/src/main/java/pt/filipe/enquadra
          cd enquadra

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "enquadra"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "pt.filipe.enquadra"
              compileSdk = 35
              defaultConfig {
                  applicationId = "pt.filipe.enquadra"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.1"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              val cx = "1.4.1"
              implementation("androidx.camera:camera-core:$cx")
              implementation("androidx.camera:camera-camera2:$cx")
              implementation("androidx.camera:camera-lifecycle:$cx")
              implementation("androidx.camera:camera-view:$cx")
              implementation("androidx.activity:activity-ktx:1.9.3")
              implementation("com.google.mlkit:object-detection:17.0.2")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.hardware.camera.any" android:required="true" />
              <application android:label="Enquadra" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/pt/filipe/enquadra/MainActivity.kt <<'EOF'
          package pt.filipe.enquadra

          import android.Manifest
          import android.app.AlertDialog
          import android.content.ContentValues
          import android.content.Context
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.DashPathEffect
          import android.graphics.Paint
          import android.graphics.RectF
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.hardware.camera2.CameraCharacteristics
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.MediaStore
          import android.text.InputType
          import android.text.SpannableString
          import android.text.Spanned
          import android.text.style.ForegroundColorSpan
          import android.util.Base64
          import android.view.Gravity
          import android.view.View
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Spinner
          import android.widget.TextView
          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.camera.camera2.interop.Camera2CameraInfo
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.ImageCapture
          import androidx.camera.core.ImageCaptureException
          import androidx.camera.core.Preview
          import androidx.camera.core.resolutionselector.AspectRatioStrategy
          import androidx.camera.core.resolutionselector.ResolutionSelector
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.view.PreviewView
          import androidx.core.content.ContextCompat
          import com.google.android.gms.tasks.Tasks
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.objects.ObjectDetection
          import com.google.mlkit.vision.objects.defaults.ObjectDetectorOptions
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.io.IOException
          import java.net.HttpURLConnection
          import java.net.SocketTimeoutException
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit
          import kotlin.math.hypot
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.roundToInt
          import kotlin.math.sqrt

          /** Box in normalized view coordinates (0..1). The view is 3:4, same as the photo. */
          data class Box(val x: Float, val y: Float, val w: Float, val h: Float) {
              val cx: Float get() = x + w / 2f
              val cy: Float get() = y + h / 2f
          }

          data class Plan(
              val subject: String, val subj: Box?, val shot: Box, val rule: String,
              val tip: String, val source: String, val note: String
          )

          class Persona(val label: String, val temp: Double, val lo: Float, val hi: Float, val cover: String, val text: String)

          class GErr(val human: String, val fatal: Boolean) : Exception(human)

          val PERSONAS: Map<String, Persona> = linkedMapOf(
              "criativo" to Persona("Criativo", 0.95, 0.20f, 0.75f, "20-60%",
                  "Style: creative and bold, like a street or fine-art photographer with a strong eye. Look past the obvious subject. Seek:\n" +
                  "- details and textures most people miss; patterns and repetition, ideally with one element that breaks it;\n" +
                  "- light as the subject: backlight, rim light, hard shadows, light and shadow shapes, glow, silhouettes;\n" +
                  "- reflections in glass, water and puddles; layers with something in the foreground framing the scene;\n" +
                  "- abstract geometry: lines, curves, diagonals, colour blocks, minimal compositions with a small subject in a large empty space.\n" +
                  "Frame with intent and some tension: off-centre placement, a tight crop on a detail, strong diagonals, deliberate negative space. A deliberate cut is fine; an accidental one is not."),
              "equilibrado" to Persona("Equilibrado", 0.5, 0.30f, 0.65f, "30-55%",
                  "Style: balanced. A strong subject with good light, placed with a composition rule that suits the scene."),
              "classico" to Persona("Clássico", 0.3, 0.35f, 0.65f, "30-55%",
                  "Style: classic and clean. One clear, readable subject, placed on the rule of thirds or centred when symmetric. Calm, balanced framing with breathing room."),
              "minimal" to Persona("Minimalista", 0.6, 0.25f, 0.60f, "25-55%",
                  "Style: minimalist. One simple element, lots of clean negative space, few colours, simple geometry. Avoid busy areas."),
              "documental" to Persona("Documental", 0.5, 0.35f, 0.70f, "35-65%",
                  "Style: documentary. People, gestures and everyday moments first; otherwise the detail that tells the story of the place. Honest framing, little stylisation.")
          )

          /** Draws the target frame and the guide line from the centre of the view to it. */
          class Overlay(ctx: Context) : View(ctx) {
              var target: RectF? = null
              var aligned = false
              private val pFrame = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE; strokeWidth = 6f; color = Color.WHITE }
              private val pLine = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; strokeWidth = 4f; color = Color.argb(210, 255, 255, 255)
                  pathEffect = DashPathEffect(floatArrayOf(18f, 14f), 0f)
              }
              private val pDot = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE }
              private val pDim = Paint().apply { color = Color.argb(110, 0, 0, 0) }
              private val pGrid = Paint().apply { color = Color.argb(60, 255, 255, 255); strokeWidth = 2f }

              override fun onDraw(c: Canvas) {
                  super.onDraw(c)
                  val w = width.toFloat()
                  val h = height.toFloat()
                  for (i in 1..2) {
                      c.drawLine(w * i / 3f, 0f, w * i / 3f, h, pGrid)
                      c.drawLine(0f, h * i / 3f, w, h * i / 3f, pGrid)
                  }
                  val t = target ?: return
                  val r = RectF(t.left * w, t.top * h, t.right * w, t.bottom * h)
                  c.save()
                  c.clipOutRect(r)
                  c.drawRect(0f, 0f, w, h, pDim)
                  c.restore()
                  pFrame.color = if (aligned) Color.rgb(255, 214, 10) else Color.WHITE
                  c.drawRect(r, pFrame)
                  if (!aligned) {
                      c.drawLine(w / 2f, h / 2f, r.centerX(), r.centerY(), pLine)
                      c.drawCircle(w / 2f, h / 2f, 10f, pDot)
                      c.drawCircle(r.centerX(), r.centerY(), 16f, pFrame)
                  }
              }
          }

          class MainActivity : ComponentActivity(), SensorEventListener {
              companion object {
                  const val M1 = "gemini-3.5-flash-lite"
                  const val M2 = "gemini-3.8-flash"
                  const val PAUSE_MS = 120_000L
                  const val CHECK_MS = 120_000L
                  const val G_UNKNOWN = 0
                  const val G_OK = 1
                  const val G_DOWN = 2
                  const val G_NOKEY = 3
                  const val G_BADKEY = 4
              }

              private lateinit var previewView: PreviewView
              private lateinit var overlay: Overlay
              private lateinit var msg: TextView
              private lateinit var chip: TextView
              private lateinit var zoomTxt: TextView
              private lateinit var aiBtn: Button
              private lateinit var shutter: Button

              private var camera: androidx.camera.core.Camera? = null
              private var imageCapture: ImageCapture? = null
              private val io = Executors.newSingleThreadExecutor()
              private val ui = Handler(Looper.getMainLooper())
              private val prefs by lazy { getSharedPreferences("enquadra", Context.MODE_PRIVATE) }
              private lateinit var sensors: SensorManager

              private val rot = floatArrayOf(1f, 0f, 0f, 0f, 1f, 0f, 0f, 0f, 1f)
              private var rot0: FloatArray? = null
              private var hTan = 0.55f   // tan(half field of view) at 1x, across the portrait view
              private var vTan = 0.73f   // same, along the portrait view

              private var plan: Plan? = null
              private var targetZoom = 1f
              private var alignedSince = 0L
              private var zoomedIn = false
              private var busy = false
              private val seen = ArrayList<String>()
              private val paused = java.util.concurrent.ConcurrentHashMap<String, Long>()   // model -> skip until (ms)

              // Gemini health, checked when the camera opens and every 2 minutes: the ✦ button never waits for a dead service.
              private val net = Executors.newSingleThreadExecutor()
              @Volatile private var gState = G_UNKNOWN
              @Volatile private var gModel = ""
              private var checking = false
              private val checker = object : Runnable {
                  override fun run() {
                      checkGemini()
                      ui.postDelayed(this, CHECK_MS)
                  }
              }

              private val detector by lazy {
                  ObjectDetection.getClient(
                      ObjectDetectorOptions.Builder()
                          .setDetectorMode(ObjectDetectorOptions.SINGLE_IMAGE_MODE)
                          .enableMultipleObjects()
                          .enableClassification()
                          .build()
                  )
              }

              private val askCam = registerForActivityResult(ActivityResultContracts.RequestPermission()) { ok ->
                  if (ok) startCamera() else say("Sem permissão de câmara.")
              }

              // ---------- UI ----------
              private fun dp(v: Int) = (v * resources.displayMetrics.density).roundToInt()
              private fun pref(k: String, d: String) = prefs.getString(k, d) ?: d
              private fun say(t: String) { msg.text = t }
              private fun persona(): Persona = PERSONAS[pref("persona", "criativo")] ?: PERSONAS.getValue("criativo")

              /** Coloured dot + who will answer the next ✦. */
              private fun renderChip() {
                  val (dot, color, text) = when (gState) {
                      G_OK -> Triple("●", Color.rgb(52, 199, 89), "Gemini · $gModel")
                      G_DOWN -> Triple("●", Color.rgb(255, 69, 58), "Gemini em baixo · IA local")
                      G_BADKEY -> Triple("●", Color.rgb(255, 69, 58), "Chave inválida · IA local")
                      G_NOKEY -> Triple("○", Color.GRAY, "IA local · sem chave do Gemini")
                      else -> Triple("●", Color.rgb(255, 204, 0), "A verificar o Gemini…")
                  }
                  val sp = SpannableString("$dot  $text · ${persona().label}")
                  sp.setSpan(ForegroundColorSpan(color), 0, dot.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                  chip.text = sp
              }

              private fun setGemini(state: Int, model: String = "") {
                  gState = state
                  gModel = model
                  ui.post { renderChip() }
              }

              /** Tiny request (a few tokens, 4 s limit) to every configured model, in order. */
              private fun checkGemini() {
                  if (checking) return
                  val key = pref("key", "").trim()
                  if (key.isEmpty()) { setGemini(G_NOKEY); return }
                  checking = true
                  if (gState != G_OK) setGemini(G_UNKNOWN)
                  val list = models()
                  net.execute {
                      var state = G_DOWN
                      var ok = ""
                      for (m in list) {
                          try {
                              val body = JSONObject()
                                  .put("contents", JSONArray().put(JSONObject().put("role", "user")
                                      .put("parts", JSONArray().put(JSONObject().put("text", "ok")))))
                                  .put("generationConfig", JSONObject().put("maxOutputTokens", 5))
                              post(key, m, body, 3000, 4000)
                              state = G_OK; ok = m
                              break
                          } catch (e: GErr) {
                              if (e.fatal) { state = G_BADKEY; break }
                          } catch (e: Exception) {
                              // try the next model
                          }
                      }
                      if (state == G_OK) paused.clear()
                      ui.post { checking = false }
                      setGemini(state, ok)
                  }
              }

              private fun models(): List<String> =
                  listOf(pref("model1", M1).trim(), pref("model2", M2).trim()).filter { it.isNotEmpty() }.distinct()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  sensors = getSystemService(Context.SENSOR_SERVICE) as SensorManager

                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setBackgroundColor(Color.BLACK) }

                  val top = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(16), dp(36), dp(8), dp(4))
                  }
                  chip = TextView(this).apply { setTextColor(Color.LTGRAY); textSize = 13f }
                  val settings = Button(this).apply { text = "⚙"; textSize = 18f; setOnClickListener { openSettings() } }
                  top.addView(chip, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  top.addView(settings)

                  val stage = FrameLayout(this)
                  previewView = PreviewView(this).apply {
                      scaleType = PreviewView.ScaleType.FILL_CENTER
                      implementationMode = PreviewView.ImplementationMode.COMPATIBLE
                  }
                  overlay = Overlay(this)
                  zoomTxt = TextView(this).apply {
                      setTextColor(Color.WHITE); textSize = 13f; setBackgroundColor(Color.argb(120, 0, 0, 0))
                      setPadding(dp(8), dp(4), dp(8), dp(4))
                  }
                  stage.addView(previewView, FrameLayout.LayoutParams(-1, -1))
                  stage.addView(overlay, FrameLayout.LayoutParams(-1, -1))
                  stage.addView(zoomTxt, FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL).apply { bottomMargin = dp(10) })

                  msg = TextView(this).apply {
                      setTextColor(Color.WHITE); textSize = 16f; gravity = Gravity.CENTER
                      setPadding(dp(16), dp(12), dp(16), dp(4))
                  }
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      setPadding(0, dp(8), 0, dp(24))
                  }
                  aiBtn = Button(this).apply { text = "✦"; textSize = 26f; setOnClickListener { findShot() } }
                  aiBtn.setOnLongClickListener { resetPlan(); say("Enquadramento limpo."); true }
                  shutter = Button(this).apply { text = "●"; textSize = 30f; setOnClickListener { takePhoto() } }
                  row.addView(aiBtn, LinearLayout.LayoutParams(dp(96), dp(72)).apply { marginEnd = dp(32) })
                  row.addView(shutter, LinearLayout.LayoutParams(dp(96), dp(72)))

                  val screenW = resources.displayMetrics.widthPixels
                  col.addView(top)
                  col.addView(stage, LinearLayout.LayoutParams(screenW, screenW * 4 / 3))
                  col.addView(msg)
                  col.addView(row)
                  setContentView(col)

                  chip.setOnClickListener { checkGemini() }
                  renderChip()
                  say("A abrir a câmara…")
                  if (checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) startCamera()
                  else askCam.launch(Manifest.permission.CAMERA)
              }

              override fun onResume() {
                  super.onResume()
                  sensors.getDefaultSensor(Sensor.TYPE_GAME_ROTATION_VECTOR)?.let {
                      sensors.registerListener(this, it, SensorManager.SENSOR_DELAY_GAME)
                  }
                  ui.removeCallbacks(checker)
                  ui.post(checker)
              }

              override fun onPause() {
                  super.onPause()
                  sensors.unregisterListener(this)
                  ui.removeCallbacks(checker)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  io.shutdown()
                  net.shutdown()
              }

              // ---------- Camera ----------
              private fun startCamera() {
                  val future = ProcessCameraProvider.getInstance(this)
                  future.addListener({
                      try {
                          val provider = future.get()
                          val rs = ResolutionSelector.Builder()
                              .setAspectRatioStrategy(AspectRatioStrategy.RATIO_4_3_FALLBACK_AUTO_STRATEGY)
                              .build()
                          val pv = Preview.Builder().setResolutionSelector(rs).build()
                          pv.setSurfaceProvider(previewView.surfaceProvider)
                          val ic = ImageCapture.Builder()
                              .setResolutionSelector(rs)
                              .setCaptureMode(ImageCapture.CAPTURE_MODE_MAXIMIZE_QUALITY)
                              .build()
                          provider.unbindAll()
                          camera = provider.bindToLifecycle(this, CameraSelector.DEFAULT_BACK_CAMERA, pv, ic)
                          imageCapture = ic
                          readFov()
                          camera?.cameraInfo?.zoomState?.observe(this) { z -> zoomTxt.text = String.format(Locale.US, "%.1fx", z.zoomRatio) }
                          say("Aponta e carrega em ✦")
                      } catch (e: Exception) {
                          say("Não consegui abrir a câmara: ${e.message}")
                      }
                  }, ContextCompat.getMainExecutor(this))
              }

              /** Field of view of the 1x camera, used to turn phone rotation into movement on screen. */
              private fun readFov() {
                  val info = camera?.cameraInfo ?: return
                  try {
                      val c2 = Camera2CameraInfo.from(info)
                      val f = c2.getCameraCharacteristic(CameraCharacteristics.LENS_INFO_AVAILABLE_FOCAL_LENGTHS)?.firstOrNull() ?: return
                      val s = c2.getCameraCharacteristic(CameraCharacteristics.SENSOR_INFO_PHYSICAL_SIZE) ?: return
                      if (f <= 0f) return
                      hTan = min(s.width, s.height) / (2f * f)
                      vTan = max(s.width, s.height) / (2f * f)
                  } catch (e: Exception) {
                      // keep the defaults
                  }
              }

              private fun curZoom(): Float = camera?.cameraInfo?.zoomState?.value?.zoomRatio ?: 1f

              private fun clampZoom(z: Float): Float {
                  val st = camera?.cameraInfo?.zoomState?.value ?: return z
                  return z.coerceIn(max(1f, st.minZoomRatio), max(1f, st.maxZoomRatio))
              }

              // ---------- Motion: where the target is now ----------
              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

              override fun onSensorChanged(event: SensorEvent) {
                  SensorManager.getRotationMatrixFromVector(rot, event.values)
                  updateOverlay()
              }

              /** Point seen at (nx, ny) when the scene was analysed -> where it is on screen now. */
              private fun project(nx: Float, ny: Float): FloatArray? {
                  val r0 = rot0 ?: return floatArrayOf(nx, ny)
                  val dx = (nx - 0.5f) * 2f * hTan
                  val dy = -(ny - 0.5f) * 2f * vTan
                  val dz = -1f
                  val wx = r0[0] * dx + r0[1] * dy + r0[2] * dz
                  val wy = r0[3] * dx + r0[4] * dy + r0[5] * dz
                  val wz = r0[6] * dx + r0[7] * dy + r0[8] * dz
                  val ex = rot[0] * wx + rot[3] * wy + rot[6] * wz
                  val ey = rot[1] * wx + rot[4] * wy + rot[7] * wz
                  val ez = rot[2] * wx + rot[5] * wy + rot[8] * wz
                  if (ez > -0.05f) return null
                  val z = curZoom()
                  return floatArrayOf(
                      0.5f + (ex / -ez) / (2f * hTan) * z,
                      0.5f - (ey / -ez) / (2f * vTan) * z
                  )
              }

              private fun updateOverlay() {
                  val p = plan ?: return
                  val c = project(p.shot.cx, p.shot.cy)
                  if (c == null) {
                      overlay.target = null
                      overlay.invalidate()
                      return
                  }
                  val z = curZoom()
                  val hw = p.shot.w * z / 2f
                  val hh = p.shot.h * z / 2f
                  overlay.target = RectF(c[0] - hw, c[1] - hh, c[0] + hw, c[1] + hh)
                  val off = hypot(c[0] - 0.5f, c[1] - 0.5f)
                  val now = System.currentTimeMillis()
                  if (!zoomedIn) {
                      if (off < 0.035f) {
                          if (alignedSince == 0L) alignedSince = now
                          else if (now - alignedSince > 350) zoomIn()
                      } else alignedSince = 0L
                      overlay.aligned = false
                  } else {
                      overlay.aligned = off < 0.06f
                  }
                  overlay.invalidate()
              }

              private fun zoomIn() {
                  val p = plan ?: return
                  zoomedIn = true
                  camera?.cameraControl?.setZoomRatio(targetZoom)
                  say(if (p.tip.isNotBlank()) p.tip else "Enquadrado — carrega em ●")
              }

              private fun resetPlan() {
                  plan = null
                  zoomedIn = false
                  alignedSince = 0L
                  seen.clear()
                  overlay.target = null
                  overlay.aligned = false
                  overlay.invalidate()
                  camera?.cameraControl?.setZoomRatio(1f)
              }

              // ---------- Find the shot ----------
              private fun findShot() {
                  if (busy) return
                  val cam = camera ?: return
                  val old = plan
                  if (old != null) seen.add(old.subject) else seen.clear()
                  plan = null
                  zoomedIn = false
                  alignedSince = 0L
                  overlay.target = null
                  overlay.invalidate()
                  busy = true
                  aiBtn.isEnabled = false
                  say("A procurar a foto…")
                  cam.cameraControl.setZoomRatio(1f)
                  ui.postDelayed({
                      val bmp = previewView.bitmap
                      if (bmp == null) {
                          busy = false
                          aiBtn.isEnabled = true
                          say("Ainda sem imagem da câmara.")
                      } else {
                          rot0 = rot.copyOf()
                          val small = scale(bmp, 1024)
                          val pr = prompt(small.width, small.height)
                          io.execute {
                              val p = analyse(small, pr)
                              ui.post {
                                  busy = false
                                  aiBtn.isEnabled = true
                                  applyPlan(p)
                              }
                          }
                      }
                  }, 450)
              }

              private fun applyPlan(p: Plan) {
                  plan = p
                  targetZoom = clampZoom(1f / max(p.shot.w, p.shot.h))
                  val base = "${p.subject}: alinha o centro com o alvo"
                  say(if (p.note.isNotBlank()) "${p.note}\n$base" else base)
                  updateOverlay()
              }

              private fun analyse(bmp: Bitmap, pr: String): Plan {
                  val key = pref("key", "").trim()
                  var note = ""
                  val st = gState
                  if (key.isNotEmpty() && (st == G_DOWN || st == G_BADKEY)) {
                      note = if (st == G_DOWN) "Gemini em baixo." else "Chave do Gemini inválida."
                  } else if (key.isNotEmpty()) {
                      // start with the model the health check found working
                      val list = models().sortedBy { if (it == gModel) 0 else 1 }
                      val b64 = jpegB64(bmp)
                      val now = System.currentTimeMillis()
                      for ((i, m) in list.withIndex()) {
                          val until = paused[m] ?: 0L
                          if (now < until) {
                              note = "Gemini em pausa (estava sobrecarregado)."
                              continue
                          }
                          try {
                              val res = gemini(key, m, b64, pr)
                              if (gState != G_OK || gModel != m) setGemini(G_OK, m)
                              val n = if (i == 0) "" else "Modelo principal indisponível; usei o de reserva."
                              return fromGemini(res, "Gemini · $m", n)
                          } catch (e: GErr) {
                              note = e.human
                              if (e.fatal) { setGemini(G_BADKEY); break }
                              paused[m] = System.currentTimeMillis() + PAUSE_MS
                              if (i == list.size - 1) setGemini(G_DOWN)
                          } catch (e: Exception) {
                              note = "Resposta inesperada do Gemini."
                          }
                      }
                  } else {
                      note = ""
                  }
                  return local(bmp, ("$note Usei a IA local.").trim())
              }

              private fun prompt(w: Int, h: Int): String {
                  val p = persona()
                  val extra = pref("extra", "").trim().take(400)
                  val avoid = if (seen.isEmpty()) "" else
                      "\nThe user asked for another option: choose something different from " +
                          seen.takeLast(4).joinToString(", ") { "\"" + it + "\"" } + "."
                  return "You are a photo director helping someone take a striking phone photo. " +
                      "The image is the live camera view (portrait, ${w}x${h}).\n" +
                      p.text +
                      (if (extra.isNotEmpty()) "\nThe photographer's own direction (follow it): $extra" else "") + "\n" +
                      "Pick ONE subject in it that would make the most beautiful photo when isolated with a telephoto lens (2x to 5x zoom). " +
                      "Favour: light (sun, golden light, glowing windows, light through leaves), reflections, silhouettes, strong shapes, one isolated object, textures, leading lines that end in something. " +
                      "Avoid: things cut by the image edge, clutter, plain empty sky. Never pick a lamp, street light or light bulb as the subject; choose what the light falls on, its glow on a surface, or its reflection.\n" +
                      "Then propose the shot: a rectangle with width:height = 0.750 that contains the whole subject, places it with a composition rule, " +
                      "and covers roughly ${p.cover} of the image width. Leave space in front of people or animals in the direction they look or move." +
                      avoid + "\n" +
                      "Answer with JSON only:\n" +
                      "{\"subject\":\"short description in European Portuguese, max 4 words, lowercase\"," +
                      "\"subject_box\":[ymin,xmin,ymax,xmax],\"shot_box\":[ymin,xmin,ymax,xmax]," +
                      "\"rule\":\"tercos|aurea|centro|simetrico|diagonal|minimal|moldura\"," +
                      "\"tip\":\"short instruction in European Portuguese, max 6 words\"}\n" +
                      "Coordinates are integers normalized to 0-1000."
              }

              /** POST to generateContent; returns the body of a 2xx answer or throws GErr with a human message. */
              private fun post(key: String, model: String, body: JSONObject, connectMs: Int, readMs: Int): String {
                  val c = URL("https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent").openConnection() as HttpURLConnection
                  try {
                      c.requestMethod = "POST"
                      c.connectTimeout = connectMs
                      c.readTimeout = readMs
                      c.doOutput = true
                      c.setRequestProperty("content-type", "application/json")
                      c.setRequestProperty("x-goog-api-key", key)
                      c.outputStream.use { it.write(body.toString().toByteArray()) }
                      val code = c.responseCode
                      val stream = if (code in 200..299) c.inputStream else c.errorStream
                      val text = stream?.bufferedReader()?.use { it.readText() } ?: ""
                      if (code !in 200..299) {
                          val m = try { JSONObject(text).getJSONObject("error").optString("message") } catch (e: Exception) { "" }
                          throw when {
                              code == 429 -> GErr("Gemini: limite gratuito atingido.", false)
                              code >= 500 -> GErr("Gemini sobrecarregado.", false)
                              code == 404 -> GErr("Gemini: o modelo $model não existe.", false)
                              code == 400 && m.lowercase().contains("api key") -> GErr("Gemini: a chave não é válida.", true)
                              code == 401 || code == 403 -> GErr("Gemini: a chave não tem acesso.", true)
                              else -> GErr("Gemini recusou o pedido ($code).", false)
                          }
                      }
                      return text
                  } catch (e: SocketTimeoutException) {
                      throw GErr("O Gemini demorou demasiado.", false)
                  } catch (e: IOException) {
                      throw GErr("Sem ligação ao Gemini.", false)
                  } finally {
                      c.disconnect()
                  }
              }

              private fun gemini(key: String, model: String, b64: String, pr: String): JSONObject {
                  val parts = JSONArray()
                      .put(JSONObject().put("text", pr))
                      .put(JSONObject().put("inline_data", JSONObject().put("mime_type", "image/jpeg").put("data", b64)))
                  val body = JSONObject()
                      .put("contents", JSONArray().put(JSONObject().put("role", "user").put("parts", parts)))
                      .put("generationConfig", JSONObject().put("responseMimeType", "application/json").put("temperature", persona().temp))
                  val text = post(key, model, body, 4000, 10000)
                  val cand = JSONObject(text).getJSONArray("candidates").getJSONObject(0)
                  val ps = cand.getJSONObject("content").getJSONArray("parts")
                  val sb = StringBuilder()
                  for (i in 0 until ps.length()) sb.append(ps.getJSONObject(i).optString("text"))
                  val t = sb.toString()
                  val a = t.indexOf('{')
                  val z = t.lastIndexOf('}')
                  if (a < 0 || z < a) throw GErr("Resposta inesperada do Gemini.", false)
                  return JSONObject(t.substring(a, z + 1))
              }

              private fun box(a: JSONArray?): Box? {
                  if (a == null || a.length() < 4) return null
                  fun n(i: Int): Float = (a.optDouble(i, 0.0) / 1000.0).toFloat().coerceIn(0f, 1f)
                  val y0 = min(n(0), n(2))
                  val y1 = max(n(0), n(2))
                  val x0 = min(n(1), n(3))
                  val x1 = max(n(1), n(3))
                  if (x1 - x0 < 0.01f || y1 - y0 < 0.01f) return null
                  return Box(x0, y0, x1 - x0, y1 - y0)
              }

              private fun fromGemini(r: JSONObject, source: String, note: String): Plan {
                  val subj = box(r.optJSONArray("subject_box"))
                  val shot0 = box(r.optJSONArray("shot_box"))
                  val name = r.optString("subject", "motivo").lowercase().take(36).ifBlank { "motivo" }
                  val tip = r.optString("tip", "").take(60)
                  return Plan(name, subj, fitShot(shot0, subj), r.optString("rule", "tercos"), tip, source, note)
              }

              /**
               * The AI's coordinates are approximate. Turn its proposal into a clean 3:4 frame that
               * stays inside the image and never cuts the subject, moving it as little as possible.
               */
              private fun fitShot(shot: Box?, subj: Box?): Box {
                  val p = persona()
                  var s: Float
                  var cx: Float
                  var cy: Float
                  when {
                      shot != null -> { s = sqrt(shot.w * shot.h); cx = shot.cx; cy = shot.cy }
                      subj != null -> { s = max(subj.w, subj.h) * 1.8f; cx = subj.cx; cy = subj.cy }
                      else -> { s = 0.5f; cx = 0.5f; cy = 0.5f }
                  }
                  if (subj != null) s = max(s, max(subj.w, subj.h) * 1.12f)
                  s = s.coerceIn(p.lo, p.hi)
                  if (subj != null) {
                      val m = 0.04f * s
                      val loX = subj.x + subj.w + m - s / 2f
                      val hiX = subj.x - m + s / 2f
                      cx = if (loX <= hiX) cx.coerceIn(loX, hiX) else subj.cx
                      val loY = subj.y + subj.h + m - s / 2f
                      val hiY = subj.y - m + s / 2f
                      cy = if (loY <= hiY) cy.coerceIn(loY, hiY) else subj.cy
                  }
                  cx = cx.coerceIn(s / 2f, 1f - s / 2f)
                  cy = cy.coerceIn(s / 2f, 1f - s / 2f)
                  return Box(cx - s / 2f, cy - s / 2f, s, s)
              }

              /** Free, offline fallback: ML Kit finds the main object, the frame follows the rule of thirds. */
              private fun local(bmp: Bitmap, note: String): Plan {
                  var subj: Box? = null
                  var name = "motivo"
                  try {
                      val objs = Tasks.await(detector.process(InputImage.fromBitmap(bmp, 0)), 8, TimeUnit.SECONDS)
                      val bw = bmp.width.toFloat()
                      val bh = bmp.height.toFloat()
                      val best = objs.maxByOrNull { o ->
                          val r = o.boundingBox
                          val area = r.width() * r.height() / (bw * bh)
                          val d = hypot(r.exactCenterX() / bw - 0.5f, r.exactCenterY() / bh - 0.5f)
                          area * (1.2f - d)
                      }
                      if (best != null) {
                          val r = best.boundingBox
                          subj = Box(
                              (r.left / bw).coerceIn(0f, 1f), (r.top / bh).coerceIn(0f, 1f),
                              (r.width() / bw).coerceIn(0.01f, 1f), (r.height() / bh).coerceIn(0.01f, 1f)
                          )
                          name = labelPt(best.labels.firstOrNull()?.text)
                      }
                  } catch (e: Exception) {
                      // no detection: fall back to the centre
                  }
                  val sj = subj
                  val p = persona()
                  val shot = if (sj != null) {
                      val s = (max(sj.w, sj.h) * 2f).coerceIn(p.lo, p.hi)
                      val cx = if (sj.cx < 0.5f) sj.cx + s / 6f else sj.cx - s / 6f
                      val cy = sj.cy + s / 6f
                      fitShot(Box(cx - s / 2f, cy - s / 2f, s, s), sj)
                  } else {
                      fitShot(null, null)
                  }
                  return Plan(name, sj, shot, "tercos", "Motivo num ponto forte", "IA local · ML Kit", note)
              }

              private fun labelPt(l: String?): String = when (l) {
                  "Food" -> "comida"
                  "Plant" -> "planta"
                  "Place" -> "lugar"
                  "Fashion good" -> "roupa"
                  "Home good" -> "objeto"
                  else -> "motivo"
              }

              private fun jpegB64(b: Bitmap): String {
                  val o = ByteArrayOutputStream()
                  b.compress(Bitmap.CompressFormat.JPEG, 85, o)
                  return Base64.encodeToString(o.toByteArray(), Base64.NO_WRAP)
              }

              private fun scale(b: Bitmap, maxSide: Int): Bitmap {
                  val k = min(1f, maxSide.toFloat() / max(b.width, b.height))
                  if (k >= 1f) return b
                  return Bitmap.createScaledBitmap(b, (b.width * k).roundToInt(), (b.height * k).roundToInt(), true)
              }

              // ---------- Capture ----------
              private fun takePhoto() {
                  val ic = imageCapture ?: return
                  val name = "Enquadra_" + SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date())
                  val cv = ContentValues().apply {
                      put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                      put(MediaStore.MediaColumns.MIME_TYPE, "image/jpeg")
                      put(MediaStore.MediaColumns.RELATIVE_PATH, "Pictures/Enquadra")
                  }
                  val out = ImageCapture.OutputFileOptions.Builder(contentResolver, MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cv).build()
                  val z = curZoom()
                  shutter.isEnabled = false
                  say("A tirar a foto…")
                  ic.takePicture(out, ContextCompat.getMainExecutor(this), object : ImageCapture.OnImageSavedCallback {
                      override fun onImageSaved(outputFileResults: ImageCapture.OutputFileResults) {
                          shutter.isEnabled = true
                          say("Guardada em Imagens › Enquadra (" + String.format(Locale.US, "%.1fx", z) + ")")
                          resetPlan()
                      }

                      override fun onError(exception: ImageCaptureException) {
                          shutter.isEnabled = true
                          say("Não consegui guardar: ${exception.message}")
                      }
                  })
              }

              // ---------- Settings ----------
              private fun openSettings() {
                  val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(20), dp(8), dp(20), 0) }
                  fun label(t: String) = TextView(this).apply { text = t; setPadding(0, dp(14), 0, dp(2)) }
                  val key = EditText(this).apply {
                      setText(pref("key", "")); hint = "AIza…"
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_VISIBLE_PASSWORD
                      setSingleLine(true)
                  }
                  val m1 = EditText(this).apply { setText(pref("model1", M1)); setSingleLine(true) }
                  val m2 = EditText(this).apply { setText(pref("model2", M2)); setSingleLine(true) }
                  val ids = PERSONAS.keys.toList()
                  val sp = Spinner(this)
                  sp.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, ids.map { PERSONAS.getValue(it).label })
                  sp.setSelection(max(0, ids.indexOf(pref("persona", "criativo"))))
                  val extra = EditText(this).apply { setText(pref("extra", "")); hint = "ex.: gosto de silhuetas; evita carros"; setMinLines(2) }

                  box.addView(label("Chave do Gemini (cola aqui)"))
                  box.addView(key)
                  box.addView(label("Modelo principal"))
                  box.addView(m1)
                  box.addView(label("Modelo de reserva (se o principal falhar)"))
                  box.addView(m2)
                  box.addView(label("Olhar do fotógrafo"))
                  box.addView(sp)
                  box.addView(label("Instruções tuas para a IA"))
                  box.addView(extra)
                  box.addView(TextView(this).apply {
                      text = "A app verifica o Gemini ao abrir e de 2 em 2 minutos (toca no indicador para verificar já). Em baixo, o ✦ usa logo a IA local (ML Kit), que funciona sem internet."
                      textSize = 12f
                      setPadding(0, dp(12), 0, dp(8))
                  })

                  AlertDialog.Builder(this)
                      .setTitle("Definições")
                      .setView(ScrollView(this).apply { addView(box) })
                      .setPositiveButton("Guardar") { _, _ ->
                          prefs.edit()
                              .putString("key", key.text.toString().trim())
                              .putString("model1", m1.text.toString().trim())
                              .putString("model2", m2.text.toString().trim())
                              .putString("persona", ids[sp.selectedItemPosition.coerceIn(0, ids.size - 1)])
                              .putString("extra", extra.text.toString().trim())
                              .apply()
                          paused.clear()
                          renderChip()
                          checkGemini()
                      }
                      .setNegativeButton("Cancelar", null)
                      .show()
              }
          }
          EOF

      - name: Instalar SDK Android
        id: sdk
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/passos.log") 2>&1
          echo "== SDK =="
          SDKM=$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: ${SDKM:-não encontrado}"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-35" "build-tools;34.0.0" | tail -3 || echo "AVISO: sdkmanager falhou"
          fi
          echo "sdk.dir=$ANDROID_HOME" > enquadra/local.properties

      - name: Compilar
        id: compilar
        run: |
          set -o pipefail
          gradle -p enquadra assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Mostrar o erro no resumo
        if: failure()
        run: |
          {
            echo "## Erro"
            echo "criar=${{ steps.criar.outcome }} · sdk=${{ steps.sdk.outcome }} · compilar=${{ steps.compilar.outcome }}"
            echo '```'
            [ -f passos.log ] && tail -30 passos.log
            if [ -f build.log ]; then
              echo "--- compilação ---"
              grep -E "^e: |error:|What went wrong|Could not|FAILED" -A4 build.log | head -100
              echo "--- últimas linhas ---"
              tail -30 build.log
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: enquadra-apk
          path: enquadra/app/build/outputs/apk/debug/app-debug.apk
