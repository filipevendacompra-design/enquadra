name: Enquadra (APK)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - uses: actions/checkout@v4

      - name: Criar o projeto
        id: criar
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/passos.log") 2>&1
          echo "== Criar projeto =="
          mkdir -p enquadra/app/src/main/java/pt/filipe/enquadra enquadra/app/src/main/assets
          for f in index.html u2netp.onnx nima.onnx; do
            if [ -f "$f" ]; then cp "$f" enquadra/app/src/main/assets/; echo "incluído: $f"; else echo "FALTA no repositório: $f"; exit 1; fi
          done
          echo "== Detetor de objetos (vai dentro da app) =="
          A=enquadra/app/src/main/assets; mkdir -p $A/mediapipe/wasm
          (cd "$RUNNER_TEMP" && npm pack @mediapipe/tasks-vision@0.10.14 --silent >/dev/null && tar xzf mediapipe-tasks-vision-0.10.14.tgz)
          cp "$RUNNER_TEMP/package/vision_bundle.mjs" $A/mediapipe/vision_bundle.js
          cp "$RUNNER_TEMP"/package/wasm/* $A/mediapipe/wasm/
          curl -sSfL -o $A/efficientdet_lite0.tflite https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite
          ls -la $A $A/mediapipe/wasm
          cd enquadra

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "enquadra"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.11.1" apply false
              id("org.jetbrains.kotlin.android") version "2.2.20" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          import org.jetbrains.kotlin.gradle.dsl.JvmTarget

          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "pt.filipe.enquadra"
              compileSdk = 36
              defaultConfig {
                  applicationId = "pt.filipe.enquadra"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 9
                  versionName = "0.9"
              }
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("enquadra.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          kotlin {
              compilerOptions { jvmTarget.set(JvmTarget.JVM_17) }
          }
          dependencies {
              val cx = "1.4.1"
              implementation("androidx.camera:camera-core:$cx")
              implementation("androidx.camera:camera-camera2:$cx")
              implementation("androidx.camera:camera-lifecycle:$cx")
              implementation("androidx.camera:camera-view:$cx")
              implementation("androidx.activity:activity-ktx:1.9.3")
              implementation("androidx.webkit:webkit:1.12.1")
              implementation("com.google.mlkit:genai-prompt:1.0.0-beta4")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.hardware.camera.any" android:required="true" />
              <application android:label="Enquadra" android:largeHeap="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/pt/filipe/enquadra/MainActivity.kt <<'EOF'
          package pt.filipe.enquadra

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.AlertDialog
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.webkit.RenderProcessGoneDetail
          import android.widget.Toast
          import android.content.ContentValues
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.graphics.Matrix
          import android.graphics.Outline
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.provider.MediaStore
          import android.util.Base64
          import android.util.Size
          import android.view.View
          import android.view.ViewOutlineProvider
          import android.webkit.JavascriptInterface
          import android.webkit.PermissionRequest
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebView
          import android.widget.FrameLayout
          import androidx.activity.ComponentActivity
          import androidx.activity.addCallback
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.camera.core.Camera
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.ImageAnalysis
          import androidx.camera.core.ImageCapture
          import androidx.camera.core.ImageCaptureException
          import androidx.camera.core.ImageProxy
          import androidx.camera.core.Preview
          import androidx.camera.core.UseCaseGroup
          import android.graphics.Rect
          import androidx.camera.core.resolutionselector.AspectRatioStrategy
          import androidx.camera.core.resolutionselector.ResolutionSelector
          import androidx.camera.core.resolutionselector.ResolutionStrategy
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.view.PreviewView
          import androidx.core.content.ContextCompat
          import androidx.webkit.WebViewAssetLoader
          import androidx.webkit.WebViewClientCompat
          import com.google.mlkit.genai.common.FeatureStatus
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.io.FileOutputStream
          import java.util.concurrent.Executors
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.roundToInt

          /**
           * Enquadra: the HTML app (index.html in assets) drawn over the native camera.
           * The page asks for frames, zoom (real lenses), full-resolution photos, saving and Gemini Nano through window.Native.
           */
          class MainActivity : ComponentActivity() {
              private lateinit var root: FrameLayout
              private lateinit var stageBox: FrameLayout     // sits exactly under the page's stage, clips with round corners
              private lateinit var preview: PreviewView
              private lateinit var web: WebView

              private var camera: Camera? = null
              private var imageCapture: ImageCapture? = null
              private var bound = false
              private var boundAspect = 0f
              @Volatile private var wantCamera = false
              private val frameExec = Executors.newSingleThreadExecutor()
              private val photoExec = Executors.newSingleThreadExecutor()
              private val nanoExec = Executors.newSingleThreadExecutor()
              private val ui = Handler(Looper.getMainLooper())

              private val frameLock = Any()
              private var latest: Bitmap? = null          // upright analysis frame (about 1280x960)
              private var lastPush = 0L
              @Volatile private var pageReady = false
              @Volatile private var nState = Nano.UNKNOWN

              private var fileCallback: ValueCallback<Array<Uri>>? = null
              private var pendingWebPerm: PermissionRequest? = null
              private val pickImage = registerForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                  fileCallback?.onReceiveValue(if (uri != null) arrayOf(uri) else null)
                  fileCallback = null
              }
              private val askCam = registerForActivityResult(ActivityResultContracts.RequestPermission()) { ok ->
                  val web = pendingWebPerm
                  pendingWebPerm = null
                  if (web != null) {   // the page's own camera (fallback) asked for it
                      if (ok) web.grant(arrayOf(PermissionRequest.RESOURCE_VIDEO_CAPTURE)) else web.deny()
                  } else if (ok) preview.post { bindCamera() } else camError("sem permissão para a câmara: ativa-a em Definições › Aplicações › Enquadra › Permissões")
              }

              private fun shotsDir(): File = File(cacheDir, "shots").apply { mkdirs() }
              private fun js(code: String) { ui.post { web.evaluateJavascript(code, null) } }

              private fun crashFile(): File = File(filesDir, "crash.txt")

              /** Any crash is written down and shown on the next launch, so it can be copied and sent. */
              private fun installCrashLog() {
                  val prev = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { t, e ->
                      try {
                          crashFile().writeText("Enquadra crash (" + t.name + ")\n" + android.util.Log.getStackTraceString(e).take(6000))
                      } catch (x: Throwable) {
                          // nothing more to do
                      }
                      prev?.uncaughtException(t, e)
                  }
              }

              private fun showLastCrash() {
                  val f = crashFile()
                  if (!f.exists()) return
                  val txt = try { f.readText() } catch (e: Throwable) { "" }
                  f.delete()
                  if (txt.isBlank()) return
                  AlertDialog.Builder(this)
                      .setTitle("A Enquadra fechou com um erro")
                      .setMessage(txt.take(1500))
                      .setPositiveButton("Copiar erro") { _, _ ->
                          val cb = getSystemService(ClipboardManager::class.java)
                          cb?.setPrimaryClip(ClipData.newPlainText("erro", txt))
                          Toast.makeText(this, "Copiado: cola-o no chat", Toast.LENGTH_LONG).show()
                      }
                      .setNegativeButton("Fechar", null)
                      .show()
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  installCrashLog()
                  shotsDir().listFiles()?.forEach { it.delete() }
                  val density = resources.displayMetrics.density

                  root = FrameLayout(this).apply { setBackgroundColor(Color.BLACK) }
                  stageBox = FrameLayout(this).apply {
                      clipToOutline = true
                      clipChildren = true
                      outlineProvider = object : ViewOutlineProvider() {
                          override fun getOutline(view: View, outline: Outline) {
                              outline.setRoundRect(0, 0, view.width, view.height, 20f * density)
                          }
                      }
                  }
                  preview = PreviewView(this).apply {
                      implementationMode = PreviewView.ImplementationMode.COMPATIBLE
                      scaleType = PreviewView.ScaleType.FILL_CENTER
                      // stays VISIBLE: an invisible TextureView is never drawn, so the camera would never get its surface
                      pivotX = 0f
                      pivotY = 0f
                  }
                  stageBox.addView(preview, FrameLayout.LayoutParams(-1, -1))
                  root.addView(stageBox, FrameLayout.LayoutParams(1, 1))

                  web = WebView(this)
                  web.setBackgroundColor(Color.TRANSPARENT)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.settings.mediaPlaybackRequiresUserGesture = false
                  web.settings.allowFileAccess = false
                  val loader = WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this))
                      .addPathHandler("/shots/", WebViewAssetLoader.InternalStoragePathHandler(this, shotsDir()))
                      .build()
                  web.webViewClient = object : WebViewClientCompat() {
                      override fun shouldInterceptRequest(view: WebView, request: WebResourceRequest): WebResourceResponse? =
                          loader.shouldInterceptRequest(request.url)

                      override fun onRenderProcessGone(view: WebView, detail: RenderProcessGoneDetail): Boolean {
                          try {
                              crashFile().writeText("O motor da página parou (" + (if (detail.didCrash()) "erro" else "falta de memória") + "). A app foi reaberta.")
                          } catch (e: Throwable) {
                              // ignore
                          }
                          recreate()
                          return true
                      }
                  }
                  web.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          webView: WebView, filePathCallback: ValueCallback<Array<Uri>>, fileChooserParams: FileChooserParams
                      ): Boolean {
                          fileCallback?.onReceiveValue(null)
                          fileCallback = filePathCallback
                          pickImage.launch("image/*")
                          return true
                      }

                      override fun onPermissionRequest(request: PermissionRequest) {
                          // only used when the native camera failed and the page falls back to the browser camera
                          ui.post {
                              if (!request.resources.contains(PermissionRequest.RESOURCE_VIDEO_CAPTURE)) request.deny()
                              else if (checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED)
                                  request.grant(arrayOf(PermissionRequest.RESOURCE_VIDEO_CAPTURE))
                              else { pendingWebPerm = request; askCam.launch(Manifest.permission.CAMERA) }
                          }
                      }
                  }
                  web.addJavascriptInterface(Bridge(), "Native")
                  root.addView(web, FrameLayout.LayoutParams(-1, -1))
                  setContentView(root)

                  onBackPressedDispatcher.addCallback(this) {
                      if (web.canGoBack()) web.goBack() else finish()
                  }
                  nanoExec.execute {
                      nState = try { Nano.status() } catch (e: Throwable) { FeatureStatus.UNAVAILABLE }
                  }
                  web.loadUrl("https://appassets.androidplatform.net/assets/index.html")
                  showLastCrash()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  frameExec.shutdown()
                  photoExec.shutdown()
                  nanoExec.shutdown()
              }

              // ---------- Camera ----------
              private fun camError(m: String) {
                  js("window.__camError&&__camError(" + JSONObject.quote(m) + ")")
              }

              private fun hasCam() = checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED

              /**
               * Preview, analysis frames and photos share the viewport of the stage, so the page's frame sits exactly
               * on what you see. Tries the best setup first; some phones refuse the combination, so simpler ones follow.
               */
              private fun bindCamera() {
                  if (!wantCamera || !hasCam()) return
                  if (preview.width < 16 || preview.height < 16) return          // waits for the page to place the stage
                  val aspect = preview.width.toFloat() / preview.height
                  if (bound && kotlin.math.abs(aspect - boundAspect) < 0.01f) return
                  val vp = preview.viewPort ?: return
                  val future = ProcessCameraProvider.getInstance(this)
                  future.addListener({
                      val provider = try { future.get() } catch (e: Exception) { camError("CameraX: " + e.message); return@addListener }
                      val errors = ArrayList<String>()
                      for (level in 0..2) {
                          try {
                              val r43 = ResolutionSelector.Builder()
                                  .setAspectRatioStrategy(AspectRatioStrategy.RATIO_4_3_FALLBACK_AUTO_STRATEGY)
                                  .build()
                              val pv = Preview.Builder().setResolutionSelector(r43).build()
                              pv.setSurfaceProvider(preview.surfaceProvider)
                              val anB = ImageAnalysis.Builder()
                                  .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                                  .setOutputImageFormat(ImageAnalysis.OUTPUT_IMAGE_FORMAT_RGBA_8888)
                              if (level == 0) {
                                  anB.setResolutionSelector(
                                      ResolutionSelector.Builder()
                                          .setAspectRatioStrategy(AspectRatioStrategy.RATIO_4_3_FALLBACK_AUTO_STRATEGY)
                                          .setResolutionStrategy(ResolutionStrategy(Size(1280, 960), ResolutionStrategy.FALLBACK_RULE_CLOSEST_LOWER_THEN_HIGHER))
                                          .build()
                                  )
                              } else {
                                  anB.setResolutionSelector(r43)
                              }
                              val an = anB.build()
                              an.setAnalyzer(frameExec) { img -> onFrame(img) }
                              val group = UseCaseGroup.Builder().setViewPort(vp).addUseCase(pv).addUseCase(an)
                              var ic: ImageCapture? = null
                              if (level < 2) {
                                  val icB = ImageCapture.Builder().setResolutionSelector(r43)
                                  if (level == 0) icB.setCaptureMode(ImageCapture.CAPTURE_MODE_MAXIMIZE_QUALITY)
                                  ic = icB.build()
                                  group.addUseCase(ic)
                              }
                              provider.unbindAll()
                              camera = provider.bindToLifecycle(this, CameraSelector.DEFAULT_BACK_CAMERA, group.build())
                              imageCapture = ic
                              bound = true
                              boundAspect = aspect
                              return@addListener
                          } catch (e: Exception) {
                              errors.add("nível $level: " + (e.message ?: e.javaClass.simpleName))
                          }
                      }
                      camError(errors.joinToString("; "))
                  }, ContextCompat.getMainExecutor(this))
              }

              override fun onResume() {
                  super.onResume()
                  // back from the system settings with the permission now granted
                  if (wantCamera && !bound && hasCam()) bindCamera()
              }

              /** The viewport's crop, given in buffer coordinates (before rotation). */
              private fun cropTo(b: Bitmap, r: Rect): Bitmap {
                  val x = r.left.coerceIn(0, b.width - 1)
                  val y = r.top.coerceIn(0, b.height - 1)
                  val w = r.width().coerceIn(1, b.width - x)
                  val h = r.height().coerceIn(1, b.height - y)
                  if (x == 0 && y == 0 && w == b.width && h == b.height) return b
                  return Bitmap.createBitmap(b, x, y, w, h)
              }

              private fun upright(b: Bitmap, deg: Int): Bitmap {
                  if (deg == 0) return b
                  val m = Matrix()
                  m.postRotate(deg.toFloat())
                  return Bitmap.createBitmap(b, 0, 0, b.width, b.height, m, true)
              }

              private fun scaleTo(b: Bitmap, maxSide: Int): Bitmap {
                  val k = min(1f, maxSide.toFloat() / max(b.width, b.height))
                  if (k >= 1f) return b
                  return Bitmap.createScaledBitmap(b, (b.width * k).roundToInt(), (b.height * k).roundToInt(), true)
              }

              private fun jpeg(b: Bitmap, q: Int): String {
                  val o = ByteArrayOutputStream()
                  b.compress(Bitmap.CompressFormat.JPEG, q, o)
                  return Base64.encodeToString(o.toByteArray(), Base64.NO_WRAP)
              }

              /** About 12 small frames a second go to the page for tracking; the sharp one is kept for grab(). */
              private fun onFrame(img: ImageProxy) {
                  try {
                      val now = SystemClock.uptimeMillis()
                      if (now - lastPush < 70) return
                      lastPush = now
                      val up = upright(cropTo(img.toBitmap(), img.cropRect), img.imageInfo.rotationDegrees)
                      synchronized(frameLock) { latest = up }
                      if (!pageReady) return
                      val b64 = jpeg(scaleTo(up, 420), 72)
                      val z = camera?.cameraInfo?.zoomState?.value?.zoomRatio ?: 1f
                      js("window.__nf&&__nf('data:image/jpeg;base64,$b64',$z)")
                  } catch (e: Throwable) {
                      // skip this frame (also when memory is short)
                  } finally {
                      img.close()
                  }
              }

              private fun capture(id: String, x: Double, y: Double, w: Double, h: Double) {
                  val ic = imageCapture
                  if (ic == null) { js("window.__photo&&__photo('$id','')"); return }   // simplest setup: the page uses the viewfinder image
                  ic.takePicture(photoExec, object : ImageCapture.OnImageCapturedCallback() {
                      override fun onCaptureSuccess(image: ImageProxy) {
                          try {
                              val deg = image.imageInfo.rotationDegrees
                              val raw = cropTo(image.toBitmap(), image.cropRect)
                              image.close()
                              val bmp = upright(raw, deg)
                              val cx = (x * bmp.width).roundToInt().coerceIn(0, bmp.width - 1)
                              val cy = (y * bmp.height).roundToInt().coerceIn(0, bmp.height - 1)
                              val cw = (w * bmp.width).roundToInt().coerceIn(1, bmp.width - cx)
                              val ch = (h * bmp.height).roundToInt().coerceIn(1, bmp.height - cy)
                              val crop = Bitmap.createBitmap(bmp, cx, cy, cw, ch)
                              val f = File(shotsDir(), "$id.jpg")
                              FileOutputStream(f).use { crop.compress(Bitmap.CompressFormat.JPEG, 95, it) }
                              js("window.__photo&&__photo('$id','https://appassets.androidplatform.net/shots/$id.jpg')")
                          } catch (e: Throwable) {
                              js("window.__photo&&__photo('$id','')")
                          }
                      }

                      override fun onError(exception: ImageCaptureException) {
                          js("window.__photo&&__photo('$id','')")
                      }
                  })
              }

              // ---------- What the page can ask for ----------
              inner class Bridge {
                  @JavascriptInterface
                  fun info(): String {
                      val z = camera?.cameraInfo?.zoomState?.value
                      return JSONObject()
                          .put("minZoom", (z?.minZoomRatio ?: 1f).toDouble())
                          .put("maxZoom", (z?.maxZoomRatio ?: 1f).toDouble())
                          .put("zoom", (z?.zoomRatio ?: 1f).toDouble())
                          .put("nano", nanoStatus())
                          .toString()
                  }

                  @JavascriptInterface
                  fun startCamera() {
                      pageReady = true
                      wantCamera = true
                      ui.post {
                          if (hasCam()) preview.post { bindCamera() } else askCam.launch(Manifest.permission.CAMERA)
                      }
                  }

                  @JavascriptInterface
                  fun hasCameraPermission(): Boolean =
                      checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED

                  @JavascriptInterface
                  fun stopCamera() {
                      ui.post {
                          try { ProcessCameraProvider.getInstance(this@MainActivity).get().unbindAll() } catch (e: Throwable) { }
                          bound = false
                          wantCamera = false
                          camera = null
                          imageCapture = null
                      }
                  }

                  @JavascriptInterface
                  fun setZoom(z: Double) {
                      ui.post {
                          val st = camera?.cameraInfo?.zoomState?.value
                          if (st != null) camera?.cameraControl?.setZoomRatio(z.toFloat().coerceIn(st.minZoomRatio, st.maxZoomRatio))
                      }
                  }

                  @JavascriptInterface
                  fun setPreviewRect(x: Double, y: Double, w: Double, h: Double) {
                      ui.post {
                          val d = resources.displayMetrics.density
                          val lp = FrameLayout.LayoutParams(max(1, (w * d).roundToInt()), max(1, (h * d).roundToInt()))
                          lp.leftMargin = (x * d).roundToInt()
                          lp.topMargin = (y * d).roundToInt()
                          stageBox.layoutParams = lp
                          stageBox.invalidateOutline()
                          preview.post { bindCamera() }   // (re)bind once laid out: the viewport follows the stage
                      }
                  }

                  @JavascriptInterface
                  fun previewVisible(v: Boolean) {
                      ui.post { stageBox.alpha = if (v) 1f else 0f }
                  }

                  /** The same digital zoom the page applies to the browser video: translate, then scale from the top-left. */
                  @JavascriptInterface
                  fun setPreviewTransform(z: Double, tx: Double, ty: Double) {
                      ui.post {
                          val d = resources.displayMetrics.density
                          preview.scaleX = z.toFloat()
                          preview.scaleY = z.toFloat()
                          preview.translationX = (tx * d).toFloat()
                          preview.translationY = (ty * d).toFloat()
                      }
                  }

                  @JavascriptInterface
                  fun grab(maxSide: Int): String {
                      val b = synchronized(frameLock) { latest } ?: return ""
                      return "data:image/jpeg;base64," + jpeg(scaleTo(b, maxSide), 88)
                  }

                  @JavascriptInterface
                  fun takePhoto(id: String, x: Double, y: Double, w: Double, h: Double) {
                      ui.post { capture(id, x, y, w, h) }
                  }

                  @JavascriptInterface
                  fun saveJpeg(name: String, b64: String): String {
                      return try {
                          val bytes = Base64.decode(b64, Base64.DEFAULT)
                          val cv = ContentValues().apply {
                              put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                              put(MediaStore.MediaColumns.MIME_TYPE, "image/jpeg")
                              put(MediaStore.MediaColumns.RELATIVE_PATH, "Pictures/Enquadra")
                          }
                          val uri = contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cv) ?: return "err"
                          contentResolver.openOutputStream(uri)?.use { it.write(bytes) }
                          "ok"
                      } catch (e: Exception) {
                          "err"
                      }
                  }

                  @JavascriptInterface
                  fun nanoStatus(): String = when (nState) {
                      FeatureStatus.AVAILABLE -> "ready"
                      FeatureStatus.DOWNLOADABLE -> "downloadable"
                      FeatureStatus.DOWNLOADING -> "downloading"
                      Nano.UNKNOWN -> "checking"
                      else -> "unavailable"
                  }

                  @JavascriptInterface
                  fun nanoDownload() {
                      nState = FeatureStatus.DOWNLOADING
                      nanoExec.execute {
                          try {
                              Nano.download { m -> js("window.__nanoProgress&&__nanoProgress(" + JSONObject.quote(m) + ")") }
                              nState = Nano.status()
                          } catch (e: Throwable) {
                              nState = FeatureStatus.UNAVAILABLE
                          }
                          js("window.__nanoProgress&&__nanoProgress(" + JSONObject.quote(Nano.statusText(nState)) + ")")
                      }
                  }

                  @JavascriptInterface
                  fun nanoAsk(id: String, prompt: String, b64: String) {
                      nanoExec.execute {
                          var text = ""
                          var err = ""
                          try {
                              val bytes = Base64.decode(b64, Base64.DEFAULT)
                              val bmp = BitmapFactory.decodeByteArray(bytes, 0, bytes.size)
                              text = Nano.ask(scaleTo(bmp, 768), prompt, 0.6f, 20000)
                          } catch (e: Throwable) {
                              err = e.javaClass.simpleName + ": " + (e.message ?: "")
                          }
                          js("window.__nano&&__nano(" + JSONObject.quote(id) + "," + JSONObject.quote(text) + "," + JSONObject.quote(err) + ")")
                      }
                  }
              }
          }
          EOF

          cat > app/src/main/java/pt/filipe/enquadra/Nano.kt <<'EOF'
          package pt.filipe.enquadra

          import android.graphics.Bitmap
          import com.google.mlkit.genai.common.DownloadStatus
          import com.google.mlkit.genai.common.FeatureStatus
          import com.google.mlkit.genai.prompt.Generation
          import com.google.mlkit.genai.prompt.ImagePart
          import com.google.mlkit.genai.prompt.TextPart
          import com.google.mlkit.genai.prompt.generateContentRequest
          import kotlinx.coroutines.runBlocking
          import kotlinx.coroutines.withTimeout

          /** Gemini Nano on the phone (ML Kit Prompt API). Every call blocks: use them off the main thread. */
          object Nano {
              const val UNKNOWN = -100
              private val model by lazy { Generation.getClient() }

              fun status(): Int = try {
                  runBlocking { model.checkStatus() }
              } catch (e: Exception) {
                  FeatureStatus.UNAVAILABLE
              }

              fun statusText(s: Int): String = when (s) {
                  FeatureStatus.AVAILABLE -> "pronto"
                  FeatureStatus.DOWNLOADABLE -> "por descarregar"
                  FeatureStatus.DOWNLOADING -> "a descarregar"
                  UNKNOWN -> "a verificar"
                  else -> "não disponível neste telemóvel"
              }

              fun baseModel(): String = try {
                  runBlocking { model.getBaseModelName() }
              } catch (e: Exception) {
                  ""
              }

              fun download(progress: (String) -> Unit) {
                  try {
                      runBlocking {
                          model.download().collect { st ->
                              when (st) {
                                  is DownloadStatus.DownloadStarted -> progress("Gemini Nano: a descarregar…")
                                  is DownloadStatus.DownloadProgress -> progress("Gemini Nano: ${st.totalBytesDownloaded / 1_000_000} MB descarregados")
                                  is DownloadStatus.DownloadFailed -> progress("Gemini Nano: a descarga falhou (${st.e.message})")
                                  else -> progress("Gemini Nano pronto.")
                              }
                          }
                      }
                  } catch (e: Exception) {
                      progress("Gemini Nano: ${e.message}")
                  }
              }

              fun ask(bmp: Bitmap, prompt: String, temp: Float, timeoutMs: Long): String = runBlocking {
                  withTimeout(timeoutMs) {
                      val req = generateContentRequest(ImagePart(bmp), TextPart(prompt)) {
                          temperature = temp
                          maxOutputTokens = 300
                      }
                      model.generateContent(req).candidates.firstOrNull()?.text ?: ""
                  }
              }
          }
          EOF

      - name: Instalar SDK Android
        id: sdk
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/passos.log") 2>&1
          echo "== SDK =="
          SDKM=$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: ${SDKM:-não encontrado}"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-36" "build-tools;35.0.0" | tail -3 || echo "AVISO: sdkmanager falhou"
          fi
          echo "sdk.dir=$ANDROID_HOME" > enquadra/local.properties

      - name: Assinatura fixa
        id: assinar
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KS" ]; then
            echo "ERRO: falta o segredo DEBUG_KEYSTORE (Settings > Secrets and variables > Actions). Sem ele cada APK tem outra assinatura e não atualiza por cima." | tee -a passos.log
            exit 1
          fi
          echo "$KS" | tr -d ' \n\r' | base64 -d > enquadra/app/enquadra.keystore
          FP=$(keytool -list -v -keystore enquadra/app/enquadra.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep -m1 "SHA256:" | sed 's/.*SHA256: //')
          if [ -z "$FP" ]; then echo "ERRO: o segredo DEBUG_KEYSTORE não é uma chave válida." | tee -a passos.log; exit 1; fi
          echo "Assinatura fixa SHA-256: $FP" | tee -a passos.log
          echo "Assinatura: \`${FP:0:23}…\` (tem de ser sempre a mesma)" >> "$GITHUB_STEP_SUMMARY"

      - name: Compilar
        id: compilar
        run: |
          set -o pipefail
          gradle -p enquadra assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Mostrar o erro no resumo
        if: failure()
        run: |
          {
            echo "## Erro"
            echo "criar=${{ steps.criar.outcome }} · sdk=${{ steps.sdk.outcome }} · assinar=${{ steps.assinar.outcome }} · compilar=${{ steps.compilar.outcome }}"
            echo '```'
            [ -f passos.log ] && tail -30 passos.log
            if [ -f build.log ]; then
              echo "--- compilação ---"
              grep -E "^e: |error:|What went wrong|Could not|FAILED|requires|incompatible" -A4 build.log | head -120
              echo "--- últimas linhas ---"
              tail -30 build.log
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: enquadra-apk-0.9
          path: enquadra/app/build/outputs/apk/debug/app-debug.apk
