          cat > app/src/main/java/pt/filipe/enquadra/Look.kt <<'EOF'
          package pt.filipe.enquadra

          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.ColorMatrix
          import android.graphics.ColorMatrixColorFilter
          import android.graphics.Paint
          import android.graphics.Typeface
          import kotlin.math.min

          /** Filters (colour matrices) and borders for the finished photo. */
          object Look {
              val FILTERS = listOf(
                  "clean" to "Natural", "vivo" to "Vivo", "quente" to "Quente", "claro" to "Claro", "suave" to "Suave",
                  "dourado" to "Dourado", "cinema" to "Cinema", "pelicula" to "Película", "pb" to "P&B", "noir" to "Noir"
              )
              val BORDERS = listOf(
                  "none" to "Sem moldura", "white" to "Branca", "galeria" to "Galeria", "polaroid" to "Polaroid", "ficha" to "Ficha"
              )

              fun validFilter(id: String) = FILTERS.any { it.first == id }
              fun validBorder(id: String) = BORDERS.any { it.first == id }

              private fun contrast(c: Float): ColorMatrix {
                  val t = 128f * (1f - c)
                  return ColorMatrix(floatArrayOf(c, 0f, 0f, 0f, t, 0f, c, 0f, 0f, t, 0f, 0f, c, 0f, t, 0f, 0f, 0f, 1f, 0f))
              }

              private fun sat(s: Float) = ColorMatrix().apply { setSaturation(s) }
              private fun scale(r: Float, g: Float, b: Float) = ColorMatrix().apply { setScale(r, g, b, 1f) }
              private fun offset(r: Float, g: Float, b: Float) =
                  ColorMatrix(floatArrayOf(1f, 0f, 0f, 0f, r, 0f, 1f, 0f, 0f, g, 0f, 0f, 1f, 0f, b, 0f, 0f, 0f, 1f, 0f))

              /** Applies the matrices in the order given. */
              private fun chain(vararg m: ColorMatrix): ColorMatrix {
                  val out = ColorMatrix()
                  for (x in m) out.postConcat(x)
                  return out
              }

              private fun matrix(id: String): ColorMatrix? = when (id) {
                  "vivo" -> chain(sat(1.35f), contrast(1.08f))
                  "quente" -> chain(scale(1.08f, 1.0f, 0.9f), sat(1.05f))
                  "claro" -> chain(offset(18f, 18f, 18f), contrast(0.94f), sat(0.95f))
                  "suave" -> chain(contrast(0.82f), offset(14f, 14f, 14f), sat(0.8f))
                  "dourado" -> chain(scale(1.1f, 1.02f, 0.82f), offset(6f, 3f, 0f), sat(1.1f))
                  "cinema" -> chain(contrast(1.12f), scale(1.06f, 1.0f, 0.94f), offset(-6f, 4f, 10f), sat(1.05f))
                  "pelicula" -> chain(contrast(0.9f), sat(0.82f), scale(1.04f, 1.0f, 0.94f), offset(10f, 8f, 6f))
                  "pb" -> chain(sat(0f), contrast(1.05f))
                  "noir" -> chain(sat(0f), contrast(1.4f), offset(-10f, -10f, -10f))
                  else -> null
              }

              /** Border widths as fractions of the photo's short side: left, top, right, bottom. */
              private fun margins(id: String): FloatArray = when (id) {
                  "white" -> floatArrayOf(0.03f, 0.03f, 0.03f, 0.03f)
                  "galeria" -> floatArrayOf(0.09f, 0.09f, 0.09f, 0.11f)
                  "polaroid" -> floatArrayOf(0.05f, 0.05f, 0.05f, 0.24f)
                  "ficha" -> floatArrayOf(0.03f, 0.03f, 0.03f, 0.12f)
                  else -> floatArrayOf(0f, 0f, 0f, 0f)
              }

              fun render(src: Bitmap, filter: String, border: String, caption: String, info: String): Bitmap {
                  val s = min(src.width, src.height).toFloat()
                  val m = margins(border)
                  val l = (s * m[0]).toInt()
                  val t = (s * m[1]).toInt()
                  val r = (s * m[2]).toInt()
                  val b = (s * m[3]).toInt()
                  val out = Bitmap.createBitmap(src.width + l + r, src.height + t + b, Bitmap.Config.ARGB_8888)
                  val c = Canvas(out)
                  c.drawColor(if (border == "polaroid") Color.rgb(250, 249, 245) else Color.WHITE)
                  val p = Paint(Paint.FILTER_BITMAP_FLAG)
                  matrix(filter)?.let { p.colorFilter = ColorMatrixColorFilter(it) }
                  c.drawBitmap(src, l.toFloat(), t.toFloat(), p)
                  if (border == "polaroid" && caption.isNotBlank()) {
                      val tp = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          color = Color.rgb(60, 60, 64)
                          textSize = b * 0.30f
                          typeface = Typeface.create("cursive", Typeface.NORMAL)
                          textAlign = Paint.Align.CENTER
                      }
                      c.drawText(caption, out.width / 2f, t + src.height + b * 0.58f, tp)
                  }
                  if (border == "ficha") {
                      val tp = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          color = Color.rgb(70, 70, 74)
                          textSize = b * 0.26f
                          typeface = Typeface.create(Typeface.SANS_SERIF, Typeface.NORMAL)
                      }
                      c.drawText(info, l.toFloat(), t + src.height + b * 0.6f, tp)
                  }
                  return out
              }
          }
          EOF

          cat > app/src/main/java/pt/filipe/enquadra/Nano.kt <<'EOF'
          package pt.filipe.enquadra

          import android.graphics.Bitmap
          import com.google.mlkit.genai.common.DownloadStatus
          import com.google.mlkit.genai.common.FeatureStatus
          import com.google.mlkit.genai.prompt.Generation
          import com.google.mlkit.genai.prompt.ImagePart
          import com.google.mlkit.genai.prompt.TextPart
          import com.google.mlkit.genai.prompt.generateContentRequest
          import kotlinx.coroutines.runBlocking
          import kotlinx.coroutines.withTimeout

          /** Gemini Nano on the phone (ML Kit Prompt API). Every call blocks: use them off the main thread. */
          object Nano {
              const val UNKNOWN = -100
              private val model by lazy { Generation.getClient() }

              fun status(): Int = try {
                  runBlocking { model.checkStatus() }
              } catch (e: Exception) {
                  FeatureStatus.UNAVAILABLE
              }

              fun statusText(s: Int): String = when (s) {
                  FeatureStatus.AVAILABLE -> "pronto"
                  FeatureStatus.DOWNLOADABLE -> "por descarregar"
                  FeatureStatus.DOWNLOADING -> "a descarregar"
                  UNKNOWN -> "a verificar"
                  else -> "não disponível neste telemóvel"
              }

              fun baseModel(): String = try {
                  runBlocking { model.getBaseModelName() }
              } catch (e: Exception) {
                  ""
              }

              fun download(progress: (String) -> Unit) {
                  try {
                      runBlocking {
                          model.download().collect { st ->
                              when (st) {
                                  is DownloadStatus.DownloadStarted -> progress("Gemini Nano: a descarregar…")
                                  is DownloadStatus.DownloadProgress -> progress("Gemini Nano: ${st.totalBytesDownloaded / 1_000_000} MB descarregados")
                                  is DownloadStatus.DownloadFailed -> progress("Gemini Nano: a descarga falhou (${st.e.message})")
                                  else -> progress("Gemini Nano pronto.")
                              }
                          }
                      }
                  } catch (e: Exception) {
                      progress("Gemini Nano: ${e.message}")
                  }
              }

              fun ask(bmp: Bitmap, prompt: String, temp: Float, timeoutMs: Long): String = runBlocking {
                  withTimeout(timeoutMs) {
                      val req = generateContentRequest(ImagePart(bmp), TextPart(prompt)) {
                          temperature = temp
                          maxOutputTokens = 300
                      }
                      model.generateContent(req).candidates.firstOrNull()?.text ?: ""
                  }
              }
          }
          EOF

      - name: Instalar SDK Android
        id: sdk
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/passos.log") 2>&1
          echo "== SDK =="
          SDKM=$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: ${SDKM:-não encontrado}"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-36" "build-tools;35.0.0" | tail -3 || echo "AVISO: sdkmanager falhou"
          fi
          echo "sdk.dir=$ANDROID_HOME" > enquadra/local.properties

      - name: Assinatura fixa
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | tr -d ' \n\r' | base64 -d > ~/.android/debug.keystore
            echo "Assinatura fixa: atualizações instalam por cima." >> passos.log
          else
            echo "AVISO: sem o segredo DEBUG_KEYSTORE; a assinatura muda em cada compilação." | tee -a passos.log
          fi

      - name: Compilar
        id: compilar
        run: |
          set -o pipefail
          gradle -p enquadra assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Mostrar o erro no resumo
        if: failure()
        run: |
          {
            echo "## Erro"
            echo "criar=${{ steps.criar.outcome }} · sdk=${{ steps.sdk.outcome }} · compilar=${{ steps.compilar.outcome }}"
            echo '```'
            [ -f passos.log ] && tail -30 passos.log
            if [ -f build.log ]; then
              echo "--- compilação ---"
              grep -E "^e: |error:|What went wrong|Could not|FAILED|requires|incompatible" -A4 build.log | head -120
              echo "--- últimas linhas ---"
              tail -30 build.log
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: enquadra-apk-0.3
          path: enquadra/app/build/outputs/apk/debug/app-debug.apk
