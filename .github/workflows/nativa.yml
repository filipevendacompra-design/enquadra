name: Enquadra nativa (APK)

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/nativa.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - uses: actions/checkout@v4

      - name: Instalar SDK Android
        id: sdk
        run: |
          SDKM=$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: ${SDKM:-não encontrado}"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-36" "build-tools;35.0.0" | tail -3 || echo "AVISO: sdkmanager falhou"
          fi
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Assinatura fixa
        id: assinar
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KS" ]; then echo "ERRO: falta o segredo DEBUG_KEYSTORE." | tee -a passos.log; exit 1; fi
          echo "$KS" | tr -d ' \n\r' | base64 -d > android/app/enquadra.keystore
          FP=$(keytool -list -v -keystore android/app/enquadra.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep -m1 "SHA256:" | sed 's/.*SHA256: //')
          if [ -z "$FP" ]; then echo "ERRO: o segredo DEBUG_KEYSTORE não é uma chave válida." | tee -a passos.log; exit 1; fi
          echo "Assinatura: \`${FP:0:23}…\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Testes do motor (Kotlin = JavaScript)
        id: testes
        continue-on-error: true
        run: |
          set -o pipefail
          gradle -p android testDebugUnitTest --no-daemon -i 2>&1 | tee test.log | grep -E "salTot|tercos|simetrico|minimal|aurea|diagonal|centro|moldura|subjCenter|^m |locate|PASSED|FAILED|tests completed" || true
          exit ${PIPESTATUS[0]}

      - name: Compilar
        id: compilar
        run: |
          set -o pipefail
          gradle -p android assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Resumo
        if: always()
        run: |
          note() { python3 -c 'import sys,urllib.parse; t=sys.stdin.read()[:3500]; print(t.replace("%","%25").replace("\r","").replace("\n","%0A"))'; }
          {
            echo "## Testes: ${{ steps.testes.outcome }} · Compilar: ${{ steps.compilar.outcome }}"
            if [ -f test.log ]; then
              echo '```'
              grep -E "salTot|tercos \[|simetrico \[|minimal \[|aurea \[|diagonal \[|centro \[|moldura \[|subjCenter|m \[0|locate |FAILED|AssertionError|expected" test.log | head -40
              echo '```'
            fi
            if [ "${{ steps.compilar.outcome }}" != "success" ] && [ -f build.log ]; then
              echo "### Erro de compilação"
              echo '```'
              grep -E "^e: |error:|What went wrong|Could not|FAILED" -A3 build.log | head -100
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # the same, as annotations (readable through the API)
          if [ -f test.log ]; then
            echo "::notice title=testes ${{ steps.testes.outcome }}::$(grep -E "salTot|tercos \[|simetrico \[|minimal \[|aurea \[|diagonal \[|centro \[|moldura \[|subjCenter|m \[0|locate |FAILED|AssertionError|expected" test.log | head -40 | note)"
          fi
          if [ -f build.log ]; then
            echo "::notice title=compilar ${{ steps.compilar.outcome }}::$( (grep -E "^e: |error:|What went wrong|Could not" -A3 build.log | head -60; grep -E "^w: " build.log | head -15) | note)"
          fi
          true

      - uses: actions/upload-artifact@v4
        if: always() && steps.compilar.outcome == 'success'
        with:
          name: enquadra-nativa
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar o APK para descarregar no telemóvel
        if: always() && steps.compilar.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk enquadra-nativa.apk
          V=$(grep -m1 'versionName' android/app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          gh release view apk >/dev/null 2>&1 || gh release create apk --prerelease --target "${{ github.sha }}" --title "Enquadra nativa" --notes "APK de teste"
          gh release upload apk enquadra-nativa.apk --clobber
          gh release edit apk --title "Enquadra nativa $V" --notes "Versão $V · $(date -u +'%Y-%m-%d %H:%M') UTC. Abre no telemóvel e carrega em enquadra-nativa.apk."
          echo "Descarregar: https://github.com/${{ github.repository }}/releases/download/apk/enquadra-nativa.apk" >> "$GITHUB_STEP_SUMMARY"
